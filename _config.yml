# Technical configuration. For everyday editing, start with README.md.
title: Damien Rouchouse
author: Damien Rouchouse
locale: en-US
description: "Research and notes on mathematics and machine learning by Damien Rouchouse."
url: "https://damidoum.github.io"
baseurl: ""
repository: "Damidoum/Damidoum.github.io"
timezone: Europe/Paris

# Content, personal settings and presentation have separate homes.
collections_dir: content
data_dir: settings
layouts_dir: design/layouts
includes_dir: design/includes
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      nav: notebook
      math: true
      topic: Mathematics
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      nav: projects
      math: true
      topic: Project notes
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      nav: research
      math: true

include:
  - files
exclude:
  - vendor
  - node_modules
  - local
  - tmp
  - .bundle
  - .github
  - .openai
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - site
  - tools
  - docs
  - settings
  - design/layouts
  - design/includes

encoding: utf-8
markdown: kramdown
highlighter: rouge
future: false
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
feed:
  path: feed.xml
