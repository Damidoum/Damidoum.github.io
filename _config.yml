# Personal site. Content stays in Markdown; the design is independent of Academic Pages.
title: Damien Rouchouse
name: Damien Rouchouse
locale: en-US
description: "Mathematics, machine learning, and open horizons. Research and notes by Damien Rouchouse."
url: "https://damidoum.github.io"
baseurl: ""
repository: "Damidoum/Damidoum.github.io"
timezone: Europe/Paris

author:
  name: Damien Rouchouse
  email: damien.rouchouse@gmail.com
  location: Paris, France
  github: Damidoum
  linkedin: damien-rouchouse
  googlescholar: "https://scholar.google.com/citations?user=ZEo6qaUAAAAJ&hl=en"
  arxiv: "https://arxiv.org/search/?searchtype=author&query=Rouchouse%2C+D"

# Only genuine content collections are published.
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      nav: notebook
      math: true
      topic: Mathematics
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      nav: projects
      math: true
      topic: Project notes
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      nav: research
      math: true
  - scope:
      path: _projects/inria_internship.md
    values:
      formula: "ReLU(λx) = λ ReLU(x)"
      cover_label: "Positive scaling · λ > 0"
  - scope:
      path: _projects/mva_projects.md
    values:
      formula: "∂²u / ∂t² = c²Δu"
      cover_label: "Waves & control"

include:
  - _pages
  - files
# Preserve the old theme sources for reference, but do not publish its demo pages.
exclude:
  - vendor
  - node_modules
  - local
  - tmp
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-cache
  - .jekyll-assets-cache
  - .asset-cache
  - .openai
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - CONTRIBUTING.md
  - README.md
  - CUSTOMIZE.md
  - LICENSE
  - scripts
  - markdown_generator
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - assets/css/main.scss
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md

encoding: utf-8
markdown: kramdown
highlighter: rouge
future: false
permalink: /blog/:year/:month/:day/:title/
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
feed:
  path: feed.xml
