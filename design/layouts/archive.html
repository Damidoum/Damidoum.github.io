---
layout: base
---
<div class="wrap page-content{% if page.nav == 'cv' %} cv-page{% endif %}">
  <header class="page-heading">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    {% if page.nav == 'cv' %}<a class="button" href="{{ '/files/cv.pdf' | relative_url }}">Download CV <span aria-hidden="true">↓</span></a>{% endif %}
  </header>
  {% if page.nav == 'cv' %}<div class="prose">{{ content }}</div>{% else %}{{ content }}{% endif %}
</div>
