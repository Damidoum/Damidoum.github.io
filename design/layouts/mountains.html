---
layout: base
---
<div class="wrap">
  <header class="page-heading"><h1>Mountains</h1></header>
  {% if site.data.photos.size > 0 %}
  <div class="photo-grid">{% for photo in site.data.photos %}<figure><a href="{{ photo.image | relative_url }}"><img src="{{ photo.image | relative_url }}" alt="{{ photo.alt | escape }}" {% if photo.width and photo.height %}width="{{ photo.width }}" height="{{ photo.height }}"{% endif %} loading="lazy"></a><figcaption>{{ photo.title | escape }}<span>{{ photo.location | escape }}{% if photo.date %} · {{ photo.date | date: '%B %Y' }}{% endif %}</span></figcaption></figure>{% endfor %}</div>
  {% else %}
  <figure class="gallery-feature"><img src="{{ '/assets/images/alpine-placeholder.jpg' | relative_url }}" alt="A snow-covered Alpine ridge near Flums in Switzerland, photographed by Niklas Liniger" width="2400" height="1600"><figcaption><span>Illustration · personal photographs coming soon</span><span>Photo by <a href="https://unsplash.com/photos/glacier-mountains-during-day-BZpt3Qn09WQ">Niklas Liniger / Unsplash</a></span></figcaption></figure>

  {% endif %}
</div>
