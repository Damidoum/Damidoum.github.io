---
layout: base
---
<div class="wrap">
  <section class="hero" aria-labelledby="intro-title">
    <div class="hero-copy">
      <h1 id="intro-title">About</h1>
      <p class="intro">{{ site.data.profile.intro }}</p>
      <p class="intro-status">{{ site.data.profile.status }}</p>
      <div class="hero-actions"><a class="text-link" href="{{ '/research/' | relative_url }}">Research</a><a class="text-link" href="{{ '/cv/' | relative_url }}">CV</a><a class="text-link" href="mailto:{{ site.data.profile.email }}">Email</a></div>
    </div>
    <div class="portrait-block"><img src="{{ site.data.profile.portrait | relative_url }}" alt="{{ site.data.profile.name }}" width="720" height="720" fetchpriority="high"></div>
  </section>
  <section class="home-notebook" aria-labelledby="notebook-title">
    <div class="section-heading"><h2 id="notebook-title">Recent notes</h2><a class="text-link" href="{{ '/blog/' | relative_url }}">All notes →</a></div>
    {% include site/notebook.html limit=2 %}
  </section>
</div>
