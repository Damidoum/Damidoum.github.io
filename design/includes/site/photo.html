<figure{% if include.filterable %} data-photo-location="{{ include.photo.location | default: '' | escape }}"{% endif %}>
  <a href="{{ include.photo.image | relative_url }}"><img src="{{ include.photo.thumbnail | default: include.photo.image | relative_url }}" alt="{{ include.photo.alt | escape }}"{% if include.photo.width and include.photo.height %} width="{{ include.photo.width }}" height="{{ include.photo.height }}"{% endif %}{% if include.photo.thumbnail_position %} style="object-position: {{ include.photo.thumbnail_position | escape }}"{% endif %} loading="lazy"></a>
  {% if include.photo.title or include.photo.location or include.photo.date %}<figcaption>{{ include.photo.title | escape }}<span>{% if include.photo.location %}{{ include.photo.location | escape }}{% if include.photo.date %} · {% endif %}{% endif %}{% if include.photo.date %}<time datetime="{{ include.photo.date | date: '%Y-%m-%d' }}">{{ include.photo.date | date: '%-d %B %Y' }}</time>{% endif %}</span></figcaption>{% endif %}
</figure>
